server:
  port: 8072

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: accounts
              uri: lb://accounts
              predicates:
                - Path=/eazybank/accounts/**
              filters:
                - RewritePath=/eazybank/accounts/(?<segment>.*), /api/$\{segment}
            - id: cards
              uri: lb://cards
              predicates:
                - Path=/eazybank/cards/**
              filters:
                - RewritePath=/eazybank/cards/(?<segment>.*), /api/$\{segment}
            - id: loans
              uri: lb://loans
              predicates:
                - Path=/eazybank/loans/**
              filters:
                - RewritePath=/eazybank/loans/(?<segment>.*), /api/$\{segment}

eureka:
  instance:
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://${EUREKA_SERVER_HOST:localhost}:8070/eureka/

info:
  app:
    name: "gatewayserver"
    description: "Eazy Bank Gateway Server Application"
    version: "1.0.0"

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"
