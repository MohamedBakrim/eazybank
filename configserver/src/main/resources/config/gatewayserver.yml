server:
  port: 8072

# NOTE: The gateway routes (path predicates + rewrite/circuit-breaker/retry/rate-limiter
# filters) are defined once, programmatically, in GatewayserverApplication.RouteLocator.
# Do not define spring.cloud.gateway routes here as well - they would be a second,
# conflicting source of truth.

eureka:
  instance:
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://${EUREKA_SERVER_HOST:localhost}:8070/eureka/

info:
  app:
    name: "gatewayserver"
    description: "Eazy Bank Gateway Server Application"
    version: "1.0.0"

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"
