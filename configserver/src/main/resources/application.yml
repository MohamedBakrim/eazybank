spring:
  application:
    name: "configserver"
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: "classpath:/config"

management:
  endpoints:
    web:
      exposure:
        # Only health/info are exposed by default; set MANAGEMENT_ENDPOINTS_EXPOSE=* to open up
        include: ${MANAGEMENT_ENDPOINTS_EXPOSE:health,info}
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# Symmetric key used by the config server to encrypt/decrypt config values.
# Never commit a real key - provide CONFIG_ENCRYPT_KEY via environment/K8s Secret.
encrypt:
  key: ${CONFIG_ENCRYPT_KEY:changeme}

server:
  port: 8071

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"