services:

  configserver:
    image: eazybank/configserver:1.0
    build: ./configserver
    container_name: configserver
    networks:
      - eazybank
    ports:
      - "8071:8071"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8071/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  eurekaserver:
    image: eazybank/eurekaserver:1.0
    build: ./eurekaserver
    container_name: eurekaserver
    networks:
      - eazybank
    ports:
      - "8070:8070"
    environment:
      CONFIG_SERVER_HOST: configserver
    depends_on:
      configserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8070/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  accounts:
    image: eazybank/accounts:1.0
    build: ./accounts
    container_name: accounts
    networks:
      - eazybank
    ports:
      - "8080:8080"
    environment:
      CONFIG_SERVER_HOST: configserver
      EUREKA_SERVER_HOST: eurekaserver
    depends_on:
      configserver:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy

  cards:
    image: eazybank/cards:1.0
    build: ./cards
    container_name: cards
    networks:
      - eazybank
    ports:
      - "8081:9000"
    environment:
      CONFIG_SERVER_HOST: configserver
      EUREKA_SERVER_HOST: eurekaserver
    depends_on:
      configserver:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy

  loans:
    image: eazybank/loans:1.0
    build: ./loans
    container_name: loans
    networks:
      - eazybank
    ports:
      - "8090:8090"
    environment:
      CONFIG_SERVER_HOST: configserver
      EUREKA_SERVER_HOST: eurekaserver
    depends_on:
      configserver:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy

  gatewayserver:
    image: eazybank/gatewayserver:1.0
    build: ./gatewayserver
    container_name: gatewayserver
    networks:
      - eazybank
    ports:
      - "8072:8072"
    environment:
      CONFIG_SERVER_HOST: configserver
      EUREKA_SERVER_HOST: eurekaserver
    depends_on:
      configserver:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy

  message:
    image: eazybank/message:1.0
    build: ./message
    container_name: message
    networks:
      - eazybank
    ports:
      - "9010:9010"
    environment:
      CONFIG_SERVER_HOST: configserver
      EUREKA_SERVER_HOST: eurekaserver
    depends_on:
      configserver:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - eazybank
    ports:
      - "6379:6379"
  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    networks:
      - eazybank
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
networks:
  eazybank:
    driver: bridge