apiVersion: apps/v1
kind: Deployment

metadata:
  name: accounts
  namespace: eazybank

spec:
  replicas: 1

  selector:
    matchLabels:
      app: accounts

  template:
    metadata:
      labels:
        app: accounts

    spec:
      containers:
        - name: accounts
          image: eazybank/accounts:1.0

          ports:
            - containerPort: 8080

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          env:
            - name: CONFIG_SERVER_HOST
              value: "configserver"

            - name: EUREKA_SERVER_HOST
              value: "eurekaserver"

            # Read by the Spring Cloud Stream Kafka binder (producer + consumer)
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092