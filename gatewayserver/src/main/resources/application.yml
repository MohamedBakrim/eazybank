spring:
  application:
    name: "gatewayserver"

  config:
    import: "optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:8071/"

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
              lowerCaseServiceId: true

          httpclient:
            connect-timeout: 1000
            response-timeout: 10s

  data:
    redis:
      connect-timeout: 2s
      host: redis
      port: 6379
      timeout: 1s

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: "http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:7080}/realms/master/protocol/openid-connect/certs"

management:
  endpoints:
    web:
      exposure:
        # Only health/info are exposed by default; set MANAGEMENT_ENDPOINTS_EXPOSE=* to open up
        include: ${MANAGEMENT_ENDPOINTS_EXPOSE:health,info}

  health:
    redis:
      enabled: false

  info:
    env:
      enabled: true

  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: "gatewayserver"
    description: "Eazy Bank Gateway Server Application"
    version: "1.0.0"

logging:
  level:
    com:
      eazybytes:
        gatewayserver: DEBUG

  pattern:
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"

resilience4j.circuitbreaker:
  configs:
    default:
      slidingWindowSize: 10
      permittedNumberOfCallsInHalfOpenState: 2
      failureRateThreshold: 50
      waitDurationInOpenState: 10000